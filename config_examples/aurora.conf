# =====================================================================
#  Modele de configuration WireGuard pour AuroraVPN
#  A placer dans : C:\ProgramData\AuroraVPN\aurora.conf
#  Installation  : wireguard.exe /installtunnelservice aurora.conf
# =====================================================================

[Interface]
# Cle privee generee une seule fois sur le client.
# wg genkey > private.key && wg pubkey < private.key > public.key
PrivateKey = REMPLACER_PAR_CLE_PRIVEE_CLIENT

# Adresse IP attribuee dans le tunnel (IPv4 + IPv6).
Address    = 10.66.66.2/32, fd66:66:66::2/128

# DNS du tunnel (chiffres en DoH cote OS si Windows 11).
DNS        = 1.1.1.1, 9.9.9.9, 2606:4700:4700::1111

# MTU recommande pour eviter la fragmentation derriere PPPoE/4G.
MTU        = 1420

# Bloque tout trafic hors tunnel (kill switch WireGuard natif).
Table      = auto

[Peer]
# Cle publique du serveur AuroraVPN.
PublicKey           = REMPLACER_PAR_CLE_PUBLIQUE_SERVEUR

# Cle pre-partagee optionnelle (renforce le PFS).
PresharedKey        = REMPLACER_PAR_PSK_OPTIONNELLE

# Endpoint du serveur (UDP). Utiliser le port 51820 par defaut, ou 443
# pour tenter une traversee de pare-feu strict.
Endpoint            = vpn-fr-par-01.aurora.example.com:51820

# Tunnel total : tout le trafic passe par le VPN.
AllowedIPs          = 0.0.0.0/0, ::/0

# Garde le tunnel actif derriere NAT (pratique sur 4G/Wi-Fi public).
PersistentKeepalive = 25
